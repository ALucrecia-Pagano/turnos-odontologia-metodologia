[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnos-odontologia-backend"
version = "0.1.0"
description = "Backend de la agenda de turnos para consultorios odontologicos"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
