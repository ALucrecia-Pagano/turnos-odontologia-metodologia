[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnos-odontologia-backend"
version = "0.1.0"
description = "Backend de la agenda de turnos para consultorios odontologicos"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2024.1",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "fastapi>=0.118,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.10", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = ["integration: tests that require the PostgreSQL and Redis services"]
addopts = '-m "not integration"'

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
